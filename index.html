<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juthi's Vocab Master Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Hind+Siliguri:wght@400;600&display=swap");
      body {
        font-family: "Inter", "Hind Siliguri", sans-serif;
      }
      .custom-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 4px;
      }
      @keyframes slideUp {
        from {
          transform: translateY(100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .animate-slide-up {
        animation: slideUp 0.3s ease-out forwards;
      }
    </style>
  </head>
  <body class="bg-gray-100 h-screen flex flex-col items-center">
    
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] hidden transition-all duration-300 transform -translate-y-full opacity-0">
      <div class="bg-gray-900/95 backdrop-blur text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-3 text-sm font-bold border border-gray-700">
        <i id="toastIcon" class="fa-solid fa-triangle-exclamation text-yellow-400 text-lg"></i>
        <span id="toastMessage">Warning Message Here</span>
      </div>
    </div>

    <div
      class="w-full max-w-md h-full bg-white shadow-2xl flex flex-col relative overflow-hidden"
    >
      <div class="p-4 bg-white border-b shadow-sm sticky top-0 z-10">
        <div class="flex justify-between items-center mb-4">
          <div class="flex items-center gap-2">
            <div
              class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-lg"
            >
              <i class="fa-solid fa-graduation-cap text-sm"></i>
            </div>
            <h1 class="text-lg font-extrabold text-gray-800">
              Juthi's <span class="text-indigo-600">VocabMaster</span>
            </h1>
          </div>

          <div class="flex gap-2">
            <button
              onclick="toggleTools()"
              class="bg-gray-100 hover:bg-gray-200 text-gray-700 w-8 h-8 rounded-full transition flex items-center justify-center relative"
            >
              <i class="fa-solid fa-gear"></i>
            </button>
            <button
              onclick="openAddModal()"
              class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded-full text-xs font-bold shadow-lg transition flex items-center gap-1"
            >
              <i class="fa-solid fa-plus"></i> Add
            </button>
          </div>
        </div>

        <div
          class="flex items-center justify-between bg-gray-50 rounded-xl p-2 border border-gray-100"
        >
          <button
            onclick="changeDay(-1)"
            class="w-8 h-8 flex items-center justify-center bg-white rounded shadow-sm text-gray-600 hover:text-indigo-600"
          >
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <div class="text-center flex flex-col items-center">
            <span class="block text-[10px] text-gray-400 font-bold uppercase"
              >Current Group</span
            >
            <span id="dayIndicator" class="text-base font-bold text-indigo-900"
              >Day 1</span
            >
            <span id="wordCountBadge" class="block text-[10px] font-bold text-indigo-600 bg-indigo-100 rounded-full px-2 mt-0.5">
              0/30 Words
            </span>
            <div class="flex gap-1.5 mt-2 text-[10px] font-bold">
              <span title="Learned" class="flex items-center gap-1 text-green-700 bg-green-100 px-1.5 py-0.5 rounded shadow-sm"><i class="fa-solid fa-check"></i> <span id="statLearned">0</span></span>
              <span title="Needs Review" class="flex items-center gap-1 text-orange-600 bg-orange-100 px-1.5 py-0.5 rounded shadow-sm"><i class="fa-solid fa-rotate-left"></i> <span id="statReview">0</span></span>
              <span title="Pending" class="flex items-center gap-1 text-gray-600 bg-gray-200 px-1.5 py-0.5 rounded shadow-sm"><i class="fa-solid fa-minus"></i> <span id="statPending">0</span></span>
            </div>
          </div>
          <button
            onclick="changeDay(1)"
            class="w-8 h-8 flex items-center justify-center bg-white rounded shadow-sm text-gray-600 hover:text-indigo-600"
          >
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>

        <div
          id="toolsMenu"
          class="hidden absolute right-4 top-16 bg-white shadow-xl border rounded-xl p-2 w-48 z-50"
        >
          <button
            onclick="openSmartImport()"
            class="w-full text-left px-3 py-2 hover:bg-indigo-50 rounded-lg text-xs font-bold text-gray-700 flex items-center gap-2"
          >
            <i class="fa-solid fa-magic-wand-sparkles text-indigo-500"></i>
            Smart Text Import
          </button>
          <button
            onclick="downloadBackup()"
            class="w-full text-left px-3 py-2 hover:bg-indigo-50 rounded-lg text-xs font-bold text-gray-700 flex items-center gap-2"
          >
            <i class="fa-solid fa-download text-green-600"></i> Backup Data
          </button>
          <label
            class="w-full text-left px-3 py-2 hover:bg-indigo-50 rounded-lg text-xs font-bold text-gray-700 flex items-center gap-2 cursor-pointer"
            ><i class="fa-solid fa-upload text-blue-600"></i> Restore
            Backup<input
              type="file"
              id="backupFile"
              class="hidden"
              onchange="restoreBackup(this)"
          /></label>
        </div>
      </div>

      <div
        class="flex-1 overflow-y-auto bg-gray-50 p-4 custom-scroll"
        onclick="closeTools()"
      >
        <div id="wordList" class="space-y-3 pb-20"></div>
      </div>
    </div>

    <div
      id="wordModal"
      class="fixed inset-0 z-40 hidden flex items-center justify-center p-4"
    >
      <div
        class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity"
        onclick="closeModal('wordModal')"
      ></div>
      <div
        class="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden relative z-50 animate-slide-up"
      >
        <div class="absolute top-4 right-4 z-20 flex gap-2">
          <button
            onclick="editCurrentWord()"
            class="w-8 h-8 bg-white/20 hover:bg-white/40 text-white rounded-full flex items-center justify-center backdrop-blur-md transition"
          >
            <i class="fa-solid fa-pen text-xs"></i>
          </button>
          <button
            onclick="deleteCurrentWord()"
            class="w-8 h-8 bg-red-500/20 hover:bg-red-500 text-white rounded-full flex items-center justify-center backdrop-blur-md transition"
          >
            <i class="fa-solid fa-trash text-xs"></i>
          </button>
          <button
            onclick="closeModal('wordModal')"
            class="w-8 h-8 bg-black/20 hover:bg-black/40 text-white rounded-full flex items-center justify-center backdrop-blur-md transition ml-2"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div
          class="bg-gradient-to-br from-indigo-500 to-purple-600 p-8 text-center text-white pt-16 pb-10"
        >
          <h2 id="mWord" class="text-3xl font-bold font-serif mb-2 capitalize">
            Word
          </h2>
          <div
            class="flex justify-center items-center flex-wrap gap-2 opacity-90 text-sm"
          >
            <span
              id="mPhonetic"
              class="font-mono bg-black/20 px-2 py-0.5 rounded hidden"
            ></span>
          </div>
        </div>
        <div class="p-6 text-center space-y-4">
          <div class="flex justify-center -mt-10">
            <span
              id="mPos"
              class="w-12 h-12 flex items-center justify-center bg-white text-indigo-600 font-bold rounded-full text-lg shadow-md border-4 border-indigo-50"
              >n.</span
            >
          </div>
          <div>
            <h3
              id="mDefEng"
              class="text-gray-800 font-bold text-lg leading-tight"
            >
              Definition
            </h3>
            <p
              id="mMeaningBn"
              class="text-indigo-600 text-base font-hind font-semibold mt-1 border-t border-gray-100 pt-1 inline-block"
            ></p>
          </div>
          <div
            class="bg-indigo-50/50 border-l-4 border-indigo-400 p-3 text-left rounded-r-lg"
          >
            <p id="mExample" class="text-gray-600 italic text-sm"></p>
          </div>

          <div
            class="flex justify-center gap-6 text-xs text-gray-500 border-t border-gray-100 pt-4"
          >
            <div>
              <span class="font-bold text-teal-600 uppercase">Synonym</span
              ><br /><span id="mSyn" class="text-gray-800 font-medium">-</span>
            </div>
            <div>
              <span class="font-bold text-rose-500 uppercase">Antonym</span
              ><br /><span id="mAnt" class="text-gray-800 font-medium">-</span>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-4 mt-2">
            <button
              onclick="speakWord()"
              class="flex flex-col items-center gap-1 group"
            >
              <div
                class="w-12 h-12 rounded-full bg-yellow-100 text-yellow-600 flex items-center justify-center shadow-sm group-hover:scale-110 transition"
              >
                <i class="fa-solid fa-volume-high"></i>
              </div>
              <span class="text-[10px] font-bold text-gray-400">Speak</span>
            </button>
            <button
              onclick="setWordStatus('learned')"
              class="flex flex-col items-center gap-1 group"
            >
              <div
                class="w-12 h-12 rounded-full bg-green-100 text-green-600 flex items-center justify-center shadow-sm group-hover:bg-green-500 group-hover:text-white transition"
              >
                <i class="fa-solid fa-check"></i>
              </div>
              <span class="text-[10px] font-bold text-gray-400">Done</span>
            </button>
            
            <button
              onclick="setWordStatus('problem')"
              class="flex flex-col items-center gap-1 group"
            >
              <div
                class="w-12 h-12 rounded-full bg-orange-100 text-orange-500 flex items-center justify-center shadow-sm group-hover:bg-orange-500 group-hover:text-white transition"
              >
                <i class="fa-solid fa-rotate-left"></i>
              </div>
              <span class="text-[10px] font-bold text-gray-400">Review</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      id="smartImportModal"
      class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4"
    >
      <div class="bg-white w-full max-w-lg rounded-2xl p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-gray-800">
            <i class="fa-solid fa-magic-wand-sparkles text-indigo-600 mr-2"></i
            >Smart Text Import
          </h2>
          <button
            onclick="closeModal('smartImportModal')"
            class="text-gray-400 hover:text-red-500"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <p class="text-xs text-gray-500 mb-2">
          Paste text below. Max 30 words per day allowed.
        </p>
        <textarea
          id="smartImportInput"
          class="w-full h-64 border bg-gray-50 p-3 rounded-lg font-mono text-xs focus:outline-indigo-500"
          placeholder="1. Abate..."
        ></textarea>
        <div class="flex justify-end gap-3 mt-4">
          <button
            onclick="closeModal('smartImportModal')"
            class="px-4 py-2 text-gray-500 font-bold hover:bg-gray-100 rounded-lg text-xs"
          >
            Cancel
          </button>
          <button
            onclick="processSmartImport()"
            class="px-6 py-2 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 shadow-lg text-xs"
          >
            Parse & Save
          </button>
        </div>
      </div>
    </div>

    <div
      id="addModal"
      class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity"
    >
      <div
        class="bg-white w-full max-w-md rounded-2xl shadow-2xl h-[85vh] flex flex-col overflow-hidden animate-slide-up"
      >
        <div class="flex justify-between items-center p-5 border-b bg-gray-50/80">
          <div>
            <h2 class="text-xl font-extrabold text-gray-800 flex items-center gap-2">
              <i class="fa-solid fa-book-medical text-indigo-600"></i>
              <span id="addModalTitle">Add New Word</span>
            </h2>
            <p class="text-xs text-gray-500 font-medium mt-1">
              Adding to <span class="text-indigo-600 font-bold" id="addModalDayLabel"></span>
            </p>
          </div>
          <button
            onclick="closeModal('addModal')"
            class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 text-gray-400 hover:text-red-500 transition"
          >
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <form id="addWordForm" class="flex flex-col h-full overflow-hidden">
          <input type="hidden" id="editId" />
          
          <div class="flex-1 overflow-y-auto custom-scroll p-5 space-y-6">
            <div class="bg-indigo-50/50 p-4 rounded-xl border border-indigo-100 relative overflow-hidden">
              <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
              <div class="space-y-4">
                <div>
                  <label class="text-[11px] font-bold text-indigo-800 uppercase tracking-wider mb-1.5 flex items-center gap-1">
                    Word <span class="text-red-500 text-sm">*</span>
                  </label>
                  <input
                    type="text"
                    id="inpWord"
                    placeholder="e.g. Abate"
                    class="w-full border-b-2 border-indigo-200 p-2 focus:border-indigo-600 outline-none font-extrabold text-xl bg-transparent transition-colors text-gray-800 placeholder-gray-300"
                    required
                  />
                </div>
                <div>
                  <label class="text-[11px] font-bold text-indigo-800 uppercase tracking-wider mb-1.5 flex items-center gap-1">
                    Bangla Meaning <span class="text-red-500 text-sm">*</span>
                  </label>
                  <input
                    type="text"
                    id="inpMeaningBn"
                    placeholder="e.g. কমানো / হ্রাস করা"
                    class="w-full border border-white bg-white p-2.5 rounded-lg font-hind text-sm focus:ring-2 focus:ring-indigo-300 outline-none transition-shadow shadow-sm text-gray-700 placeholder-gray-300"
                    required
                  />
                </div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="text-xs font-bold text-gray-600 mb-1.5 block">
                  Phonetic <span class="text-gray-400 font-normal">(Optional)</span>
                </label>
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fa-solid fa-volume-low text-gray-400 text-xs"></i>
                  </div>
                  <input
                    type="text"
                    id="inpPhonetic"
                    placeholder="/əˈbeɪt/"
                    class="w-full border border-gray-200 py-2.5 pl-8 pr-3 rounded-lg bg-gray-50 text-xs focus:ring-2 focus:ring-indigo-200 outline-none focus:bg-white transition-colors"
                  />
                </div>
              </div>
              <div>
                <label class="text-xs font-bold text-gray-600 mb-1.5 block">Parts of Speech</label>
                <div class="relative">
                  <select
                    id="inpPos"
                    class="w-full border border-gray-200 p-2.5 rounded-lg bg-gray-50 text-xs focus:ring-2 focus:ring-indigo-200 outline-none text-gray-700 appearance-none focus:bg-white transition-colors cursor-pointer"
                  >
                    <option value="n.">Noun (n.)</option>
                    <option value="v.">Verb (v.)</option>
                    <option value="adj.">Adjective (adj.)</option>
                    <option value="adv.">Adverb (adv.)</option>
                    <option value="prep.">Preposition (prep.)</option>
                    <option value="conj.">Conjunction (conj.)</option>
                    <option value="phrase">Phrase/Idiom</option>
                  </select>
                  <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
                    <i class="fa-solid fa-chevron-down text-gray-400 text-[10px]"></i>
                  </div>
                </div>
              </div>
            </div>

            <div class="space-y-4">
              <div>
                <label class="text-xs font-bold text-gray-600 mb-1.5 block">English Definition</label>
                <textarea
                  id="inpDefEng"
                  placeholder="Write a simple definition..."
                  class="w-full border border-gray-200 p-3 rounded-lg bg-gray-50 text-xs h-16 resize-none focus:ring-2 focus:ring-indigo-200 outline-none focus:bg-white transition-colors placeholder-gray-300"
                ></textarea>
              </div>
              <div>
                <label class="text-xs font-bold text-gray-600 mb-1.5 block">Example Sentence</label>
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 pl-3 pt-2.5 pointer-events-none">
                    <i class="fa-solid fa-quote-left text-gray-300 text-xs"></i>
                  </div>
                  <textarea
                    id="inpExample"
                    placeholder="The storm suddenly abated..."
                    class="w-full border border-gray-200 py-2.5 pl-8 pr-3 rounded-lg bg-gray-50 text-xs h-16 resize-none focus:ring-2 focus:ring-indigo-200 outline-none focus:bg-white transition-colors placeholder-gray-300"
                  ></textarea>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-xl border border-gray-100">
              <div>
                <label class="text-[10px] font-bold text-teal-600 uppercase tracking-widest mb-1.5 flex items-center gap-1 block">
                  <i class="fa-solid fa-link text-teal-400"></i> Synonyms
                </label>
                <input
                  type="text"
                  id="inpSyn"
                  placeholder="Similar words..."
                  class="w-full border border-gray-200 p-2.5 rounded-lg text-xs focus:ring-2 focus:ring-teal-200 outline-none bg-white transition-shadow placeholder-gray-300"
                />
              </div>
              <div>
                <label class="text-[10px] font-bold text-rose-500 uppercase tracking-widest mb-1.5 flex items-center gap-1 block">
                  <i class="fa-solid fa-link-slash text-rose-400"></i> Antonyms
                </label>
                <input
                  type="text"
                  id="inpAnt"
                  placeholder="Opposite words..."
                  class="w-full border border-gray-200 p-2.5 rounded-lg text-xs focus:ring-2 focus:ring-rose-200 outline-none bg-white transition-shadow placeholder-gray-300"
                />
              </div>
            </div>

          </div>

          <div class="p-4 bg-white border-t mt-auto">
            <button
              type="submit"
              class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white rounded-xl font-bold shadow-lg shadow-indigo-200 transition-all active:scale-95 flex justify-center items-center gap-2 text-sm"
            >
              <i class="fa-solid fa-cloud-arrow-up"></i> Save to Vocabulary
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const MAX_WORDS_PER_DAY = 30; // Maximum allowed limit
      let currentDay = 1;
      let words = [];
      let currentViewingId = null;

      const initialData = [
        {
          id: 1,
          day: 1,
          status: "neutral",
          word: "Welcome",
          phonetic: "/wel-kəm/",
          meaningBn: "স্বাগতম",
          pos: "n.",
          defEng: "Greeting",
          example: "Welcome to Vocab Master.",
          syn: "Hello",
          ant: "Goodbye",
        },
      ];

      function init() {
        const stored = localStorage.getItem("vocabProData");
        words = stored ? JSON.parse(stored) : initialData;
        const lastDay = localStorage.getItem("vocabCurrentDay");
        if (lastDay) currentDay = parseInt(lastDay);
        updateDayUI();
        renderList();
      }

      function saveData() {
        localStorage.setItem("vocabProData", JSON.stringify(words));
        localStorage.setItem("vocabCurrentDay", currentDay);
      }
      
      function changeDay(dir) {
        const newDay = currentDay + dir;
        if (newDay < 1) return;
        currentDay = newDay;
        updateDayUI();
        renderList();
        saveData();
      }

      // Updated UI to show Word Count Badge & Learning Stats
      function updateDayUI() {
        document.getElementById("dayIndicator").innerText = `Day ${currentDay}`;
        
        const dayWords = words.filter(w => w.day === currentDay);
        const dayWordsCount = dayWords.length;
        const badge = document.getElementById("wordCountBadge");
        
        badge.innerText = `${dayWordsCount}/${MAX_WORDS_PER_DAY} Words`;
        
        // Change color to red if limit reached
        if(dayWordsCount >= MAX_WORDS_PER_DAY) {
            badge.classList.replace("bg-indigo-100", "bg-red-100");
            badge.classList.replace("text-indigo-600", "text-red-600");
        } else {
            badge.classList.replace("bg-red-100", "bg-indigo-100");
            badge.classList.replace("text-red-600", "text-indigo-600");
        }

        // Update Learning Stats
        const learned = dayWords.filter(w => w.status === 'learned').length;
        const review = dayWords.filter(w => w.status === 'problem').length;
        const pending = dayWords.filter(w => w.status === 'neutral').length;

        document.getElementById("statLearned").innerText = learned;
        document.getElementById("statReview").innerText = review;
        document.getElementById("statPending").innerText = pending;
      }

      // Toast Notification Logic
      function showToast(message, type = 'warning') {
        const toast = document.getElementById("toast");
        const msgEl = document.getElementById("toastMessage");
        const iconEl = document.getElementById("toastIcon");

        msgEl.innerText = message;
        if (type === 'warning') {
          iconEl.className = "fa-solid fa-triangle-exclamation text-yellow-400 text-lg";
        } else if (type === 'error') {
          iconEl.className = "fa-solid fa-circle-xmark text-red-500 text-lg";
        } else {
          iconEl.className = "fa-solid fa-circle-check text-green-400 text-lg";
        }

        toast.classList.remove("hidden");
        setTimeout(() => {
          toast.classList.remove("-translate-y-full", "opacity-0");
          toast.classList.add("translate-y-0", "opacity-100");
        }, 10);

        setTimeout(() => {
          toast.classList.remove("translate-y-0", "opacity-100");
          toast.classList.add("-translate-y-full", "opacity-0");
          setTimeout(() => toast.classList.add("hidden"), 300);
        }, 4000); // Hides after 4 seconds
      }

      function renderList() {
        const container = document.getElementById("wordList");
        container.innerHTML = "";
        const dayWords = words.filter((w) => w.day === currentDay);
        
        updateDayUI(); // Ensure UI is always perfectly synced

        if (dayWords.length === 0) {
          container.innerHTML = `<div class="text-center py-20 text-gray-400"><p class="text-sm font-bold">No words in Day ${currentDay}</p></div>`;
          return;
        }
        dayWords.forEach((item) => {
          const div = document.createElement("div");
          let statusClass = "bg-white border-l-4 border-transparent hover:border-indigo-300";
          let icon = `<i class="fa-solid fa-chevron-right text-gray-300 text-xs"></i>`;
          
          if (item.status === "learned") {
            statusClass = "bg-green-50 border-l-4 border-green-500";
            icon = `<i class="fa-solid fa-check text-green-500"></i>`;
          } else if (item.status === "problem") {
            // NEW: Review status styles and icon updated
            statusClass = "bg-orange-50 border-l-4 border-orange-500";
            icon = `<i class="fa-solid fa-rotate-left text-orange-500"></i>`;
          }
          
          div.className = `p-4 rounded-xl shadow-sm flex items-center justify-between cursor-pointer transition transform active:scale-95 ${statusClass}`;
          div.onclick = () => openWordModal(item.id);
          div.innerHTML = `<div class="flex-1 min-w-0 mr-2"><h3 class="font-bold text-gray-700 text-lg capitalize ${item.status === "learned" ? "text-green-700" : ""}">${item.word}</h3><p class="text-sm text-gray-500 font-hind truncate">${item.meaningBn || "No Meaning"}</p></div><div>${icon}</div>`;
          container.appendChild(div);
        });
      }

      function openWordModal(id) {
        currentViewingId = id;
        const item = words.find((w) => w.id === id);
        if (!item) return;
        document.getElementById("mWord").innerText = item.word;
        const phEl = document.getElementById("mPhonetic");
        if (item.phonetic) {
          phEl.innerText = item.phonetic;
          phEl.classList.remove("hidden");
        } else {
          phEl.classList.add("hidden");
        }
        document.getElementById("mMeaningBn").innerText = item.meaningBn || "No Meaning";
        document.getElementById("mPos").innerText = item.pos || "w";
        document.getElementById("mDefEng").innerText = item.defEng || "No definition";
        document.getElementById("mExample").innerText = item.example ? `"${item.example}"` : "";
        document.getElementById("mSyn").innerText = item.syn || "-";
        document.getElementById("mAnt").innerText = item.ant || "-";
        document.getElementById("wordModal").classList.remove("hidden");
      }

      function deleteCurrentWord() {
        if (!currentViewingId) return;
        if (confirm("Are you sure you want to delete this word?")) {
          words = words.filter((w) => w.id !== currentViewingId);
          saveData();
          renderList();
          closeModal("wordModal");
        }
      }

      function editCurrentWord() {
        if (!currentViewingId) return;
        const item = words.find((w) => w.id === currentViewingId);
        if (!item) return;
        closeModal("wordModal");
        openAddModal(item);
      }

      function openAddModal(editingItem = null) {
        const modal = document.getElementById("addModal");
        const form = document.getElementById("addWordForm");
        modal.classList.remove("hidden");
        if (editingItem) {
          document.getElementById("addModalTitle").innerText = "Edit Word";
          document.getElementById("editId").value = editingItem.id;
          document.getElementById("inpWord").value = editingItem.word;
          document.getElementById("inpMeaningBn").value = editingItem.meaningBn;
          document.getElementById("inpPhonetic").value = editingItem.phonetic;
          
          const posSelect = document.getElementById("inpPos");
          if ([...posSelect.options].some(opt => opt.value === editingItem.pos)) {
             posSelect.value = editingItem.pos;
          }

          document.getElementById("inpDefEng").value = editingItem.defEng;
          document.getElementById("inpExample").value = editingItem.example;
          document.getElementById("inpSyn").value = editingItem.syn || "";
          document.getElementById("inpAnt").value = editingItem.ant || "";
        } else {
          document.getElementById("addModalTitle").innerText = "Add New Word";
          form.reset();
          document.getElementById("editId").value = "";
        }
        document.getElementById("addModalDayLabel").innerText = editingItem
          ? `Day ${editingItem.day}`
          : `Day ${currentDay}`;
      }

      document.getElementById("addWordForm").addEventListener("submit", function (e) {
          e.preventDefault();
          const editId = document.getElementById("editId").value;
          
          // Validation: Limit Check for New Words
          if (!editId) {
            const currentDayCount = words.filter((w) => w.day === currentDay).length;
            if (currentDayCount >= MAX_WORDS_PER_DAY) {
              showToast(`Day ${currentDay} already has ${MAX_WORDS_PER_DAY} words! Please move to the next day to add more.`, 'error');
              return; // Halt the submission
            }
          }

          const wordData = {
            word: document.getElementById("inpWord").value,
            meaningBn: document.getElementById("inpMeaningBn").value,
            phonetic: document.getElementById("inpPhonetic").value,
            pos: document.getElementById("inpPos").value,
            defEng: document.getElementById("inpDefEng").value,
            example: document.getElementById("inpExample").value,
            syn: document.getElementById("inpSyn").value,
            ant: document.getElementById("inpAnt").value,
          };
          if (editId) {
            const index = words.findIndex((w) => w.id == editId);
            if (index > -1) words[index] = { ...words[index], ...wordData };
          } else {
            const newWord = {
              id: Date.now(),
              day: currentDay,
              status: "neutral",
              ...wordData,
            };
            words.push(newWord);
          }
          saveData();
          renderList();
          e.target.reset();
          closeModal("addModal");
        });

      function processSmartImport() {
        const text = document.getElementById("smartImportInput").value;
        if (!text.trim()) return;
        
        const blocks = text.split(/\n(?=\d+\.)/g).filter((b) => b.trim().length > 0);
        
        // Validation: Limit Check for Import
        const currentDayCount = words.filter((w) => w.day === currentDay).length;
        const availableSlots = MAX_WORDS_PER_DAY - currentDayCount;

        if (blocks.length > availableSlots) {
            showToast(`Warning: You pasted ${blocks.length} words, but Day ${currentDay} only has space for ${availableSlots} more words. Please reduce words or change day.`, 'error');
            return; // Block the import entirely to prevent mess
        }

        let count = 0;
        blocks.forEach((block, index) => {
          const rawLines = block.split("\n").map((l) => l.trim()).filter((l) => l.length > 0);
          if (rawLines.length < 2) return;
          const wordLine = rawLines[0].replace(/^\d+\.\s*/, "").trim();

          const fullBlockStr = block.replace(/\n/g, " ");
          const phoneticMatch = fullBlockStr.match(/(\/.*?\/?\/)/);
          const meaningMatch = fullBlockStr.match(/\(([^)]+)\)/);
          const defMatch = fullBlockStr.match(/Definition:\s*(.*?)(?=Example:|Synonym:|Antonym:|$)/i);
          const exMatch = fullBlockStr.match(/Example:\s*["“]?(.*?)["”]?(?=Synonym:|Antonym:|$)/i);
          const synMatch = fullBlockStr.match(/Synonyms?:\s*(.+?)(?=\s*Antonyms?:|$)/i);
          const antMatch = fullBlockStr.match(/Antonyms?:\s*(.+?)$/i);

          let pos = "n.";
          const posMatch = fullBlockStr.match(/\b(n\.|v\.|adj\.|adv\.)\b/i);
          if (posMatch) pos = posMatch[1];

          const newWord = {
            id: Date.now() + index,
            day: currentDay,
            status: "neutral",
            word: wordLine,
            phonetic: phoneticMatch ? phoneticMatch[1] : "",
            meaningBn: meaningMatch ? meaningMatch[1].trim() : "",
            pos: pos,
            defEng: defMatch ? defMatch[1].trim() : "",
            example: exMatch ? exMatch[1].trim() : "",
            syn: synMatch ? synMatch[1].trim() : "",
            ant: antMatch ? antMatch[1].trim() : "",
          };
          words.push(newWord);
          count++;
        });
        saveData();
        renderList();
        closeModal("smartImportModal");
        showToast(`Imported ${count} words successfully!`, 'success');
      }

      function setWordStatus(status) {
        if (!currentViewingId) return;
        const idx = words.findIndex((w) => w.id === currentViewingId);
        if (idx > -1) {
          words[idx].status = status;
          saveData();
          renderList();
          closeModal("wordModal");
        }
      }
      
      function speakWord() {
        const word = document.getElementById("mWord").innerText;
        if (word) {
          const u = new SpeechSynthesisUtterance(word);
          u.lang = "en-US";
          speechSynthesis.speak(u);
        }
      }
      function toggleTools() {
        document.getElementById("toolsMenu").classList.toggle("hidden");
      }
      function closeTools() {
        document.getElementById("toolsMenu").classList.add("hidden");
      }
      function openSmartImport() {
        document.getElementById("smartImportModal").classList.remove("hidden");
        document.getElementById("smartImportInput").value = "";
        closeTools();
      }
      function closeModal(id) {
        document.getElementById(id).classList.add("hidden");
      }
      function downloadBackup() {
        const dataStr =
          "data:text/json;charset=utf-8," +
          encodeURIComponent(JSON.stringify(words));
        const a = document.createElement("a");
        a.href = dataStr;
        a.download = "vocab_backup.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        closeTools();
      }
      function restoreBackup(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
          words = JSON.parse(e.target.result);
          saveData();
          renderList();
          alert("Restored!");
        };
        reader.readAsText(file);
        closeTools();
      }

      init();
    </script>
  </body>
</html>
