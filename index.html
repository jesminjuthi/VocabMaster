<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juthi's Vocab Master Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Hind+Siliguri:wght@400;600&display=swap");
      body {
        font-family: "Inter", "Hind Siliguri", sans-serif;
      }
      .custom-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 6px;
      }
      .dark .custom-scroll::-webkit-scrollbar-thumb {
        background-color: #475569;
      }
      @keyframes slideUp {
        from {
          transform: translateY(100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .animate-slide-up {
        animation: slideUp 0.3s ease-out forwards;
      }
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }
    </style>
  </head>
  <body
    class="bg-gray-100 dark:bg-gray-950 h-screen flex flex-col items-center justify-center transition-colors duration-300 sm:py-8 sm:px-4"
  >
    <div
      id="toast"
      class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] hidden transition-all duration-300 transform -translate-y-full opacity-0"
    >
      <div
        class="bg-gray-900/95 dark:bg-gray-800/95 backdrop-blur text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-3 text-sm font-bold border border-gray-700 dark:border-gray-600"
      >
        <i
          id="toastIcon"
          class="fa-solid fa-triangle-exclamation text-yellow-400 text-lg"
        ></i>
        <span id="toastMessage">Warning Message Here</span>
      </div>
    </div>

    <div
      class="w-full max-w-lg lg:max-w-xl h-full sm:h-[90vh] sm:rounded-[2rem] bg-white dark:bg-gray-900 shadow-2xl sm:border sm:border-gray-200 sm:dark:border-gray-800 flex flex-col relative overflow-hidden transition-all duration-300"
    >
      <div
        class="p-4 sm:p-6 lg:px-8 bg-white dark:bg-gray-900 border-b dark:border-gray-800 shadow-sm sticky top-0 z-10 transition-colors duration-300"
      >
        <div class="flex justify-between items-center mb-4 lg:mb-5">
          <div class="flex items-center gap-3">
            <div
              class="w-8 h-8 md:w-10 md:h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-lg transition-all"
            >
              <i class="fa-solid fa-graduation-cap text-sm md:text-lg"></i>
            </div>
            <h1
              class="text-lg md:text-2xl font-extrabold text-gray-800 dark:text-white transition-all"
            >
              Juthi's
              <span class="text-indigo-600 dark:text-indigo-400"
                >VocabMaster</span
              >
            </h1>
          </div>

          <div class="flex gap-2 md:gap-3">
            <button
              onclick="toggleTools()"
              class="bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 w-8 h-8 md:w-10 md:h-10 rounded-full transition flex items-center justify-center relative"
            >
              <i class="fa-solid fa-gear md:text-lg"></i>
            </button>
            <button
              onclick="openAddModal()"
              class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 md:px-5 md:py-2 rounded-full text-xs md:text-sm font-bold shadow-lg transition flex items-center gap-1.5"
            >
              <i class="fa-solid fa-plus"></i> Add
            </button>
          </div>
        </div>

        <div
          class="flex items-center justify-between bg-gray-50 dark:bg-gray-800 rounded-xl p-2 md:p-3 border border-gray-100 dark:border-gray-700 transition-colors duration-300"
        >
          <button
            onclick="changeDay(-1)"
            class="w-8 h-8 md:w-10 md:h-10 flex items-center justify-center bg-white dark:bg-gray-700 rounded shadow-sm text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors"
          >
            <i class="fa-solid fa-chevron-left md:text-lg"></i>
          </button>

          <div
            class="text-center flex flex-col items-center cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-700 px-3 md:px-6 py-1 rounded-lg transition-colors duration-200"
            onclick="openJumpModal()"
          >
            <span
              class="block text-[10px] md:text-xs text-gray-400 dark:text-gray-500 font-bold uppercase"
              >Current Group</span
            >
            <span
              class="text-base md:text-xl font-bold text-indigo-900 dark:text-indigo-300 flex items-center gap-1.5"
            >
              <span id="dayIndicator">Day 1</span>
              <i class="fa-solid fa-caret-down text-xs opacity-50"></i>
            </span>
            <span
              id="wordCountBadge"
              class="block text-[10px] md:text-xs font-bold text-indigo-600 dark:text-indigo-300 bg-indigo-100 dark:bg-indigo-900/50 rounded-full px-2 mt-0.5 transition-colors"
            >
              0/30 Words
            </span>
            <div class="flex gap-1.5 mt-2 text-[10px] md:text-xs font-bold">
              <span
                title="Learned"
                class="flex items-center gap-1 text-green-700 dark:text-green-400 bg-green-100 dark:bg-green-900/40 px-1.5 py-0.5 rounded shadow-sm transition-colors"
                ><i class="fa-solid fa-check"></i>
                <span id="statLearned">0</span></span
              >
              <span
                title="Needs Review"
                class="flex items-center gap-1 text-orange-600 dark:text-orange-400 bg-orange-100 dark:bg-orange-900/40 px-1.5 py-0.5 rounded shadow-sm transition-colors"
                ><i class="fa-solid fa-rotate-left"></i>
                <span id="statReview">0</span></span
              >
              <span
                title="Pending"
                class="flex items-center gap-1 text-gray-600 dark:text-gray-300 bg-gray-200 dark:bg-gray-700 px-1.5 py-0.5 rounded shadow-sm transition-colors"
                ><i class="fa-solid fa-minus"></i>
                <span id="statPending">0</span></span
              >
            </div>
          </div>

          <button
            onclick="changeDay(1)"
            class="w-8 h-8 md:w-10 md:h-10 flex items-center justify-center bg-white dark:bg-gray-700 rounded shadow-sm text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors"
          >
            <i class="fa-solid fa-chevron-right md:text-lg"></i>
          </button>
        </div>

        <div
          id="toolsMenu"
          class="hidden absolute right-4 md:right-8 top-16 md:top-24 bg-white dark:bg-gray-800 shadow-xl border dark:border-gray-700 rounded-xl p-2 w-48 md:w-56 z-50 transition-colors duration-300"
        >
          <button
            onclick="openSmartImport()"
            class="w-full text-left px-3 py-2 hover:bg-indigo-50 dark:hover:bg-gray-700 rounded-lg text-xs md:text-sm font-bold text-gray-700 dark:text-gray-200 flex items-center gap-2 transition-colors"
          >
            <i
              class="fa-solid fa-magic-wand-sparkles text-indigo-500 dark:text-indigo-400"
            ></i>
            Smart Text Import
          </button>
          <button
            onclick="downloadBackup()"
            class="w-full text-left px-3 py-2 hover:bg-indigo-50 dark:hover:bg-gray-700 rounded-lg text-xs md:text-sm font-bold text-gray-700 dark:text-gray-200 flex items-center gap-2 transition-colors"
          >
            <i
              class="fa-solid fa-download text-green-600 dark:text-green-400"
            ></i>
            Backup Data
          </button>
          <label
            class="w-full text-left px-3 py-2 hover:bg-indigo-50 dark:hover:bg-gray-700 rounded-lg text-xs md:text-sm font-bold text-gray-700 dark:text-gray-200 flex items-center gap-2 cursor-pointer transition-colors"
            ><i class="fa-solid fa-upload text-blue-600 dark:text-blue-400"></i>
            Restore Backup
            <input
              type="file"
              id="backupFile"
              class="hidden"
              onchange="restoreBackup(this)"
          /></label>
        </div>
      </div>

      <div
        class="flex-1 overflow-y-auto bg-gray-50 dark:bg-gray-950 p-4 sm:p-6 lg:p-8 custom-scroll transition-colors duration-300"
        onclick="closeTools()"
      >
        <div id="wordList" class="space-y-3 md:space-y-4 pb-20"></div>
      </div>
    </div>

    <div
      id="jumpModal"
      class="fixed inset-0 bg-gray-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity"
    >
      <div
        class="bg-white dark:bg-gray-800 w-full max-w-xs md:max-w-sm rounded-2xl p-6 shadow-2xl transition-colors duration-300 animate-slide-up"
      >
        <div class="flex justify-between items-center mb-4">
          <h2
            class="text-lg md:text-xl font-bold text-gray-800 dark:text-white transition-colors"
          >
            <i
              class="fa-solid fa-map-location-dot text-indigo-600 dark:text-indigo-400 mr-2"
            ></i
            >Select Day
          </h2>
          <button
            onclick="closeModal('jumpModal')"
            class="text-gray-400 hover:text-red-500 dark:hover:text-red-400 transition-colors"
          >
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <div class="mb-4">
          <p
            class="text-[10px] md:text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-2"
          >
            Available Days
          </p>
          <div
            id="activeDaysGrid"
            class="flex flex-wrap gap-2 max-h-40 md:max-h-56 overflow-y-auto custom-scroll p-1"
          ></div>
        </div>

        <div class="relative flex items-center py-2">
          <div
            class="flex-grow border-t border-gray-100 dark:border-gray-700"
          ></div>
          <span
            class="flex-shrink-0 mx-3 text-gray-300 dark:text-gray-600 text-[10px] md:text-xs font-bold uppercase"
            >OR</span
          >
          <div
            class="flex-grow border-t border-gray-100 dark:border-gray-700"
          ></div>
        </div>

        <p
          class="text-[10px] md:text-xs text-gray-400 dark:text-gray-500 mb-2 mt-2 text-center uppercase font-bold tracking-wider"
        >
          Jump to new day
        </p>
        <div class="flex items-center justify-center gap-2">
          <input
            type="number"
            id="jumpDayInput"
            min="1"
            class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 p-2 md:p-3 rounded-xl font-extrabold text-center text-indigo-600 dark:text-indigo-400 text-lg md:text-xl outline-none focus:ring-2 focus:ring-indigo-500 transition-colors shadow-inner"
            placeholder="Day No."
          />
          <button
            onclick="executeJump()"
            class="px-4 py-2 md:py-3 bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-white font-bold rounded-xl shadow-lg transition-colors"
          >
            Go
          </button>
        </div>
      </div>
    </div>

    <div
      id="wordModal"
      class="fixed inset-0 z-40 hidden flex items-center justify-center p-4"
    >
      <div
        class="absolute inset-0 bg-gray-900/70 backdrop-blur-sm transition-opacity"
        onclick="closeModal('wordModal')"
      ></div>
      <div
        class="bg-white dark:bg-gray-800 w-full max-w-sm md:max-w-md rounded-3xl shadow-2xl overflow-hidden relative z-50 animate-slide-up transition-colors duration-300"
      >
        <div class="absolute top-4 right-4 z-20 flex gap-2">
          <button
            onclick="editCurrentWord()"
            class="w-8 h-8 bg-white/20 hover:bg-white/40 text-white rounded-full flex items-center justify-center backdrop-blur-md transition"
          >
            <i class="fa-solid fa-pen text-xs"></i>
          </button>
          <button
            onclick="deleteCurrentWord()"
            class="w-8 h-8 bg-red-500/80 hover:bg-red-500 text-white rounded-full flex items-center justify-center backdrop-blur-md transition"
          >
            <i class="fa-solid fa-trash text-xs"></i>
          </button>
          <button
            onclick="closeModal('wordModal')"
            class="w-8 h-8 bg-black/30 hover:bg-black/50 text-white rounded-full flex items-center justify-center backdrop-blur-md transition ml-2"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div
          class="bg-gradient-to-br from-indigo-500 to-purple-600 dark:from-indigo-600 dark:to-purple-800 p-8 md:p-10 text-center text-white pt-16 md:pt-20 pb-10"
        >
          <h2
            id="mWord"
            class="text-3xl md:text-4xl font-bold font-serif mb-2 capitalize"
          >
            Word
          </h2>
          <div
            class="flex justify-center items-center flex-wrap gap-2 opacity-90 text-sm md:text-base"
          >
            <span
              id="mPhonetic"
              class="font-mono bg-black/30 px-2 py-0.5 rounded hidden"
            ></span>
          </div>
        </div>
        <div class="p-6 md:p-8 text-center space-y-4">
          <div class="flex justify-center -mt-10 md:-mt-12">
            <span
              id="mPos"
              class="w-12 h-12 md:w-14 md:h-14 flex items-center justify-center bg-white dark:bg-gray-800 text-indigo-600 dark:text-indigo-400 font-bold rounded-full text-lg shadow-md border-4 border-indigo-50 dark:border-gray-700 transition-colors"
              >n.</span
            >
          </div>
          <div>
            <h3
              id="mDefEng"
              class="text-gray-800 dark:text-gray-100 font-bold text-lg md:text-xl leading-tight transition-colors"
            >
              Definition
            </h3>
            <p
              id="mMeaningBn"
              class="text-indigo-600 dark:text-indigo-400 text-base md:text-lg font-hind font-semibold mt-1 border-t border-gray-100 dark:border-gray-700 pt-1 inline-block transition-colors"
            ></p>
          </div>
          <div
            class="bg-indigo-50/50 dark:bg-indigo-900/20 border-l-4 border-indigo-400 p-3 md:p-4 text-left rounded-r-lg transition-colors"
          >
            <p
              id="mExample"
              class="text-gray-600 dark:text-gray-300 italic text-sm md:text-base transition-colors"
            ></p>
          </div>

          <div
            class="flex justify-center gap-6 md:gap-10 text-xs md:text-sm text-gray-500 dark:text-gray-400 border-t border-gray-100 dark:border-gray-700 pt-4 transition-colors"
          >
            <div>
              <span class="font-bold text-teal-600 dark:text-teal-400 uppercase"
                >Synonym</span
              ><br /><span
                id="mSyn"
                class="text-gray-800 dark:text-gray-200 font-medium transition-colors"
                >-</span
              >
            </div>
            <div>
              <span class="font-bold text-rose-500 dark:text-rose-400 uppercase"
                >Antonym</span
              ><br /><span
                id="mAnt"
                class="text-gray-800 dark:text-gray-200 font-medium transition-colors"
                >-</span
              >
            </div>
          </div>

          <div class="grid grid-cols-3 gap-4 mt-4">
            <button
              onclick="speakWord()"
              class="flex flex-col items-center gap-1 group"
            >
              <div
                class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-yellow-100 dark:bg-yellow-900/30 text-yellow-600 dark:text-yellow-400 flex items-center justify-center shadow-sm group-hover:scale-110 transition"
              >
                <i class="fa-solid fa-volume-high md:text-lg"></i>
              </div>
              <span
                class="text-[10px] md:text-xs font-bold text-gray-400 dark:text-gray-500"
                >Speak</span
              >
            </button>
            <button
              onclick="setWordStatus('learned')"
              class="flex flex-col items-center gap-1 group"
            >
              <div
                class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 flex items-center justify-center shadow-sm group-hover:bg-green-500 dark:group-hover:bg-green-600 group-hover:text-white transition"
              >
                <i class="fa-solid fa-check md:text-lg"></i>
              </div>
              <span
                class="text-[10px] md:text-xs font-bold text-gray-400 dark:text-gray-500"
                >Done</span
              >
            </button>
            <button
              onclick="setWordStatus('problem')"
              class="flex flex-col items-center gap-1 group"
            >
              <div
                class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-orange-100 dark:bg-orange-900/30 text-orange-500 dark:text-orange-400 flex items-center justify-center shadow-sm group-hover:bg-orange-500 dark:group-hover:bg-orange-600 group-hover:text-white transition"
              >
                <i class="fa-solid fa-rotate-left md:text-lg"></i>
              </div>
              <span
                class="text-[10px] md:text-xs font-bold text-gray-400 dark:text-gray-500"
                >Review</span
              >
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      id="smartImportModal"
      class="fixed inset-0 bg-gray-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4"
    >
      <div
        class="bg-white dark:bg-gray-800 w-full max-w-lg rounded-2xl p-6 shadow-2xl transition-colors duration-300"
      >
        <div class="flex justify-between items-center mb-4">
          <h2
            class="text-lg md:text-xl font-bold text-gray-800 dark:text-white transition-colors"
          >
            <i
              class="fa-solid fa-magic-wand-sparkles text-indigo-600 dark:text-indigo-400 mr-2"
            ></i
            >Smart Text Import
          </h2>
          <button
            onclick="closeModal('smartImportModal')"
            class="text-gray-400 hover:text-red-500 dark:hover:text-red-400 transition-colors"
          >
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <div
          class="flex items-center justify-between bg-indigo-50/50 dark:bg-indigo-900/20 p-2.5 rounded-xl border border-indigo-100 dark:border-indigo-800/50 mb-3 transition-colors"
        >
          <label
            class="text-[11px] md:text-xs font-bold text-indigo-800 dark:text-indigo-300 uppercase flex items-center gap-1"
          >
            <i
              class="fa-solid fa-calendar-day text-indigo-500 dark:text-indigo-400"
            ></i>
            Target Day
          </label>
          <div class="flex items-center gap-1.5">
            <button
              type="button"
              onclick="document.getElementById('smartImportDay').stepDown()"
              class="w-6 h-6 md:w-8 md:h-8 bg-white dark:bg-gray-700 rounded shadow text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors"
            >
              <i class="fa-solid fa-minus text-[10px]"></i>
            </button>
            <input
              type="number"
              id="smartImportDay"
              min="1"
              class="w-10 md:w-14 bg-transparent text-center font-bold text-indigo-900 dark:text-indigo-100 outline-none text-base md:text-lg appearance-none transition-colors"
              required
            />
            <button
              type="button"
              onclick="document.getElementById('smartImportDay').stepUp()"
              class="w-6 h-6 md:w-8 md:h-8 bg-white dark:bg-gray-700 rounded shadow text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors"
            >
              <i class="fa-solid fa-plus text-[10px]"></i>
            </button>
          </div>
        </div>

        <p
          class="text-[11px] md:text-xs text-gray-500 dark:text-gray-400 mb-2 transition-colors"
        >
          Paste text below. It dynamically supports your new format.
        </p>
        <textarea
          id="smartImportInput"
          class="w-full h-56 md:h-64 border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 p-3 rounded-lg font-mono text-xs md:text-sm focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 outline-none transition-colors"
          placeholder="1. Abate..."
        ></textarea>
        <div class="flex justify-end gap-3 mt-4">
          <button
            onclick="closeModal('smartImportModal')"
            class="px-4 py-2 text-gray-500 dark:text-gray-400 font-bold hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg text-xs md:text-sm transition-colors"
          >
            Cancel
          </button>
          <button
            onclick="processSmartImport()"
            class="px-6 py-2 bg-indigo-600 dark:bg-indigo-500 text-white font-bold rounded-lg hover:bg-indigo-700 dark:hover:bg-indigo-600 shadow-lg text-xs md:text-sm transition-colors"
          >
            Parse & Save
          </button>
        </div>
      </div>
    </div>

    <div
      id="addModal"
      class="fixed inset-0 bg-gray-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity"
    >
      <div
        class="bg-white dark:bg-gray-800 w-full max-w-md lg:max-w-lg rounded-2xl shadow-2xl h-[85vh] flex flex-col overflow-hidden animate-slide-up transition-colors duration-300"
      >
        <div
          class="flex justify-between items-center p-5 border-b dark:border-gray-700 bg-gray-50/80 dark:bg-gray-800/80 transition-colors duration-300"
        >
          <div>
            <h2
              class="text-xl md:text-2xl font-extrabold text-gray-800 dark:text-white flex items-center gap-2 transition-colors"
            >
              <i
                class="fa-solid fa-book-medical text-indigo-600 dark:text-indigo-400"
              ></i>
              <span id="addModalTitle">Add New Word</span>
            </h2>
          </div>
          <button
            onclick="closeModal('addModal')"
            class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 dark:hover:bg-red-900/30 text-gray-400 dark:text-gray-500 hover:text-red-500 dark:hover:text-red-400 transition-colors"
          >
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <form id="addWordForm" class="flex flex-col h-full overflow-hidden">
          <input type="hidden" id="editId" />

          <div class="flex-1 overflow-y-auto custom-scroll p-5 space-y-6">
            <div
              class="flex items-center justify-between bg-indigo-50/50 dark:bg-indigo-900/20 p-3 rounded-xl border border-indigo-100 dark:border-indigo-800/50 -mt-2 transition-colors"
            >
              <label
                class="text-xs md:text-sm font-bold text-indigo-800 dark:text-indigo-300 uppercase flex items-center gap-1 tracking-wider transition-colors"
              >
                <i
                  class="fa-solid fa-calendar-day text-indigo-500 dark:text-indigo-400"
                ></i>
                Target Day
              </label>
              <div class="flex items-center gap-2">
                <button
                  type="button"
                  onclick="document.getElementById('inpDay').stepDown()"
                  class="w-7 h-7 md:w-8 md:h-8 bg-white dark:bg-gray-700 rounded shadow text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors"
                >
                  <i class="fa-solid fa-minus text-[10px]"></i>

                  >

                  </div>

                    id="inpExample"
                    placeholder="The storm suddenly abated..."
                    class="w-full border border-gray-200 dark:border-gray-700 py-2.5 md:py-3 pl-8 pr-3 rounded-lg bg-gray-50 dark:bg-gray-900 text-xs md:text-sm text-gray-800 dark:text-gray-200 h-16 md:h-20 resize-none focus:ring-2 focus:ring-indigo-200 dark:focus:ring-indigo-500 outline-none focus:bg-white dark:focus:bg-gray-800 transition-colors placeholder-gray-300 dark:placeholder-gray-600"

                  id="inpSyn"
                  placeholder="Similar words..."
                  class="w-full border border-gray-200 dark:border-gray-700 p-2.5 md:p-3 rounded-lg text-xs md:text-sm text-gray-800 dark:text-gray-200 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-teal-200 dark:focus:ring-teal-500 outline-none transition-colors placeholder-gray-300 dark:placeholder-gray-600"

                  Antonyms
                </label>

                  type="text"
                  id="inpAnt"
                  placeholder="Opposite words..."
                  class="w-full border border-gray-200 dark:border-gray-700 p-2.5 md:p-3 rounded-lg text-xs md:text-sm text-gray-800 dark:text-gray-200 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-rose-200 dark:focus:ring-rose-500 outline-none transition-colors placeholder-gray-300 dark:placeholder-gray-600"

          >

              class="w-full py-3.5 md:py-4 bg-gradient-to-r from-indigo-600 to-purple-600 dark:from-indigo-500 dark:to-purple-500 hover:from-indigo-700 hover:to-purple-700 dark:hover:from-indigo-600 dark:hover:to-purple-600 text-white rounded-xl font-bold shadow-lg shadow-indigo-200 dark:shadow-none transition-all active:scale-95 flex justify-center items-center gap-2 text-sm md:text-base"

    <script>
      const MAX_WORDS_PER_DAY = 30;
      let currentDay = 1;
      let words = [];
      let currentViewingId = null;

      const initialData = [
        {
          id: 1,
          day: 1,
          status: "neutral",
          word: "Welcome",
          phonetic: "/wel-kəm/",
          meaningBn: "স্বাগতম",
          pos: "n.",
          defEng: "Greeting",
          example: "Welcome to Vocab Master.",
          syn: "Hello",
          ant: "Goodbye",
        },
      ];

      function init() {
        const stored = localStorage.getItem("vocabProData");
        words = stored ? JSON.parse(stored) : initialData;
        const lastDay = localStorage.getItem("vocabCurrentDay");
        if (lastDay) currentDay = parseInt(lastDay);
        updateDayUI();
        renderList();
      }

      function saveData() {
        localStorage.setItem("vocabProData", JSON.stringify(words));
        localStorage.setItem("vocabCurrentDay", currentDay);
      }

      function changeDay(dir) {
        const newDay = currentDay + dir;
        if (newDay < 1) return;
        currentDay = newDay;
        updateDayUI();
        renderList();
        saveData();
      }

      function updateDayUI() {
        document.getElementById("dayIndicator").innerText = `Day ${currentDay}`;

        const dayWords = words.filter((w) => w.day === currentDay);
        const dayWordsCount = dayWords.length;
        const badge = document.getElementById("wordCountBadge");

        badge.innerText = `${dayWordsCount}/${MAX_WORDS_PER_DAY} Words`;

        if (dayWordsCount >= MAX_WORDS_PER_DAY) {
          badge.className =
            "block text-[10px] md:text-xs font-bold rounded-full px-2 mt-0.5 transition-colors bg-red-100 text-red-600 dark:bg-red-900/50 dark:text-red-400";
        } else {
          badge.className =
            "block text-[10px] md:text-xs font-bold rounded-full px-2 mt-0.5 transition-colors bg-indigo-100 text-indigo-600 dark:bg-indigo-900/50 dark:text-indigo-300";
        }

        const learned = dayWords.filter((w) => w.status === "learned").length;
        const review = dayWords.filter((w) => w.status === "problem").length;
        const pending = dayWords.filter((w) => w.status === "neutral").length;

        document.getElementById("statLearned").innerText = learned;
        document.getElementById("statReview").innerText = review;
        document.getElementById("statPending").innerText = pending;
      }

      function showToast(message, type = "warning") {
        const toast = document.getElementById("toast");
        const msgEl = document.getElementById("toastMessage");
        const iconEl = document.getElementById("toastIcon");

        msgEl.innerText = message;
        if (type === "warning") {
          iconEl.className =
            "fa-solid fa-triangle-exclamation text-yellow-400 text-lg";
        } else if (type === "error") {
          iconEl.className = "fa-solid fa-circle-xmark text-red-500 text-lg";
        } else {
          iconEl.className = "fa-solid fa-circle-check text-green-400 text-lg";
        }

        toast.classList.remove("hidden");
        setTimeout(() => {
          toast.classList.remove("-translate-y-full", "opacity-0");
          toast.classList.add("translate-y-0", "opacity-100");
        }, 10);

        setTimeout(() => {
          toast.classList.remove("translate-y-0", "opacity-100");
          toast.classList.add("-translate-y-full", "opacity-0");
          setTimeout(() => toast.classList.add("hidden"), 300);
        }, 4000);
      }

      function renderList() {
        const container = document.getElementById("wordList");
        container.innerHTML = "";
        const dayWords = words.filter((w) => w.day === currentDay);

        updateDayUI();

        if (dayWords.length === 0) {
          container.innerHTML = `<div class="text-center py-20 text-gray-400 dark:text-gray-500 w-full"><p class="text-sm font-bold">No words in Day ${currentDay}</p></div>`;
          return;
        }
        dayWords.forEach((item) => {
          const div = document.createElement("div");
          let statusClass =
            "bg-white dark:bg-gray-800 border-l-4 border-transparent hover:border-indigo-300 dark:hover:border-indigo-500";
          let icon = `<i class="fa-solid fa-chevron-right text-gray-300 dark:text-gray-600 text-xs"></i>`;
          let titleClass = "text-gray-700 dark:text-gray-200";

          if (item.status === "learned") {
            statusClass =
              "bg-green-50 dark:bg-green-900/20 border-l-4 border-green-500 dark:border-green-500";
            icon = `<i class="fa-solid fa-check text-green-500 dark:text-green-400"></i>`;
            titleClass = "text-green-700 dark:text-green-400";
          } else if (item.status === "problem") {
            statusClass =
              "bg-orange-50 dark:bg-orange-900/20 border-l-4 border-orange-500 dark:border-orange-500";
            icon = `<i class="fa-solid fa-rotate-left text-orange-500 dark:text-orange-400"></i>`;
            titleClass = "text-gray-700 dark:text-gray-200";
          }

          div.className = `p-4 md:p-5 rounded-xl shadow-sm flex items-center justify-between cursor-pointer transition-all transform hover:-translate-y-1 hover:shadow-md active:scale-95 duration-200 ${statusClass}`;
          div.onclick = () => openWordModal(item.id);
          div.innerHTML = `<div class="flex-1 min-w-0 mr-2"><h3 class="font-bold text-lg md:text-xl capitalize transition-colors ${titleClass}">${item.word}</h3><p class="text-sm md:text-base text-gray-500 dark:text-gray-400 font-hind truncate transition-colors">${item.meaningBn || "No Meaning"}</p></div><div>${icon}</div>`;
          container.appendChild(div);
        });
      }

      function openWordModal(id) {
        currentViewingId = id;
        const item = words.find((w) => w.id === id);
        if (!item) return;
        document.getElementById("mWord").innerText = item.word;
        const phEl = document.getElementById("mPhonetic");
        if (item.phonetic) {
          phEl.innerText = item.phonetic;
          phEl.classList.remove("hidden");
        } else {
          phEl.classList.add("hidden");
        }
        document.getElementById("mMeaningBn").innerText =
          item.meaningBn || "No Meaning";
        document.getElementById("mPos").innerText = item.pos || "w";
        document.getElementById("mDefEng").innerText =
          item.defEng || "No definition";
        document.getElementById("mExample").innerText = item.example
          ? `"${item.example}"`
          : "";
        document.getElementById("mSyn").innerText = item.syn || "-";
        document.getElementById("mAnt").innerText = item.ant || "-";
        document.getElementById("wordModal").classList.remove("hidden");
      }

      function deleteCurrentWord() {
        if (!currentViewingId) return;
        if (confirm("Are you sure you want to delete this word?")) {
          words = words.filter((w) => w.id !== currentViewingId);
          saveData();
          renderList();
          closeModal("wordModal");
        }
      }

      function editCurrentWord() {
        if (!currentViewingId) return;
        const item = words.find((w) => w.id === currentViewingId);
        if (!item) return;
        closeModal("wordModal");
        openAddModal(item);
      }

      function openJumpModal() {
        document.getElementById("jumpDayInput").value = "";

        const activeDays = [...new Set(words.map((w) => w.day))].sort(
          (a, b) => a - b,
        );
        const grid = document.getElementById("activeDaysGrid");
        grid.innerHTML = "";

        if (activeDays.length === 0) {
          grid.innerHTML = `<p class="text-xs text-gray-400 dark:text-gray-500 w-full text-center py-4">No active days found.</p>`;
        } else {
          activeDays.forEach((day) => {
            const btn = document.createElement("button");
            const isCurrent = day === currentDay;

            let baseClass =
              "px-3 py-1.5 rounded-lg text-xs md:text-sm font-bold transition-colors shadow-sm border flex-grow text-center ";
            if (isCurrent) {
              baseClass +=
                "bg-indigo-600 text-white border-indigo-600 dark:bg-indigo-500 dark:border-indigo-500";
            } else {
              baseClass +=
                "bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 border-gray-200 dark:border-gray-700 hover:bg-indigo-50 dark:hover:bg-gray-700 hover:border-indigo-200 dark:hover:border-gray-600";
            }

            btn.className = baseClass;
            btn.innerText = `Day ${day}`;
            btn.onclick = () => jumpToSpecificDay(day);
            grid.appendChild(btn);
          });
        }

        document.getElementById("jumpModal").classList.remove("hidden");
      }

      function jumpToSpecificDay(day) {
        currentDay = day;
        updateDayUI();
        renderList();
        saveData();
        closeModal("jumpModal");
      }

      function executeJump() {
        const val = parseInt(document.getElementById("jumpDayInput").value);
        if (val && val > 0) {
          jumpToSpecificDay(val);
        } else {
          showToast("Please enter a valid day number", "error");
        }
      }

      document
        .getElementById("jumpDayInput")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            executeJump();
          }
        });

      function getSuggestedDayForCurrentView() {
        const currentDayCount = words.filter(
          (w) => w.day === currentDay,
        ).length;
        if (currentDayCount < MAX_WORDS_PER_DAY) {
          return currentDay;
        } else {
          let d = currentDay + 1;
          while (true) {
            if (words.filter((w) => w.day === d).length < MAX_WORDS_PER_DAY)
              return d;
            d++;
          }
        }
      }

      function openAddModal(editingItem = null) {
        const modal = document.getElementById("addModal");
        const form = document.getElementById("addWordForm");
        modal.classList.remove("hidden");

        if (editingItem) {
          document.getElementById("addModalTitle").innerText = "Edit Word";
          document.getElementById("editId").value = editingItem.id;
          document.getElementById("inpDay").value = editingItem.day;

          document.getElementById("inpWord").value = editingItem.word;
          document.getElementById("inpMeaningBn").value = editingItem.meaningBn;
          document.getElementById("inpPhonetic").value = editingItem.phonetic;

          const posSelect = document.getElementById("inpPos");
          if (
            [...posSelect.options].some((opt) => opt.value === editingItem.pos)
          ) {
            posSelect.value = editingItem.pos;
          }

          document.getElementById("inpDefEng").value = editingItem.defEng;
          document.getElementById("inpExample").value = editingItem.example;
          document.getElementById("inpSyn").value = editingItem.syn || "";
          document.getElementById("inpAnt").value = editingItem.ant || "";
        } else {
          document.getElementById("addModalTitle").innerText = "Add New Word";
          form.reset();
          document.getElementById("editId").value = "";
          document.getElementById("inpDay").value =
            getSuggestedDayForCurrentView();
        }
      }

      document
        .getElementById("addWordForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const editId = document.getElementById("editId").value;
          const targetDay =
            parseInt(document.getElementById("inpDay").value) || currentDay;

          const targetDayCount = words.filter(
            (w) => w.day === targetDay && w.id != editId,
          ).length;
          if (targetDayCount >= MAX_WORDS_PER_DAY) {
            showToast(
              `Day ${targetDay} already has ${MAX_WORDS_PER_DAY} words! Please select another day.`,
              "error",
            );
            return;
          }

          const wordData = {
            day: targetDay,
            word: document.getElementById("inpWord").value,
            meaningBn: document.getElementById("inpMeaningBn").value,
            phonetic: document.getElementById("inpPhonetic").value,
            pos: document.getElementById("inpPos").value,
            defEng: document.getElementById("inpDefEng").value,
            example: document.getElementById("inpExample").value,
            syn: document.getElementById("inpSyn").value,
            ant: document.getElementById("inpAnt").value,
          };

          if (editId) {
            const index = words.findIndex((w) => w.id == editId);
            if (index > -1) words[index] = { ...words[index], ...wordData };
          } else {
            const newWord = {
              id: Date.now(),
              status: "neutral",
              ...wordData,
            };
            words.push(newWord);
          }

          currentDay = targetDay;
          saveData();
          renderList();
          e.target.reset();
          closeModal("addModal");
        });

      /* --- SMART IMPORT --- */
      function processSmartImport() {
        const text = document.getElementById("smartImportInput").value;
        if (!text.trim()) return;

        const targetDay =
          parseInt(document.getElementById("smartImportDay").value) ||
          currentDay;

        const blocks = text
          .split(/(?:^|\n)(?=\d+\.\s)/g)
          .filter((b) => b.trim().length > 0);

        const targetDayCount = words.filter((w) => w.day === targetDay).length;
        const availableSlots = MAX_WORDS_PER_DAY - targetDayCount;

        if (blocks.length > availableSlots) {
          showToast(
            `Warning: You pasted ${blocks.length} words, but Day ${targetDay} only has space for ${availableSlots} more words.`,
            "error",
          );
          return;
        }

        let count = 0;

        const stopAt =
          "(?=English:?|Bangla:?|Synonyms?:?|Antonyms?:?|Example:?|Pronounce:?|$)";

        blocks.forEach((block, index) => {

          const firstLineMatch = block.match(/^\s*\d+\.\s*([^\n]+)/);
          if (!firstLineMatch) return;
          const wordLine = firstLineMatch[1].trim();

          const phoneticMatch = block.match(/(\/.*?\/?\/)/);

          const defMatch = block.match(
            new RegExp(`English:?\\s*([\\s\\S]*?)\\s*${stopAt}`, "i"),
          );
          const meaningMatch = block.match(
            new RegExp(`Bangla:?\\s*([\\s\\S]*?)\\s*${stopAt}`, "i"),
          );
          const synMatch = block.match(
            new RegExp(`Synonyms?:?\\s*([\\s\\S]*?)\\s*${stopAt}`, "i"),
          );
          const antMatch = block.match(
            new RegExp(`Antonyms?:?\\s*([\\s\\S]*?)\\s*${stopAt}`, "i"),
          );
          const exMatch = block.match(
            new RegExp(`Example:?\\s*([\\s\\S]*?)\\s*${stopAt}`, "i"),
          );

          const newWord = {
            id: Date.now() + index,
            day: targetDay,
            status: "neutral",
            word: wordLine,
            phonetic: phoneticMatch ? phoneticMatch[1] : "",
            meaningBn: meaningMatch ? meaningMatch[1].trim() : "",
            pos: "n.", 
            defEng: defMatch ? defMatch[1].trim() : "",
            
            example: exMatch
              ? exMatch[1].trim().replace(/^["“']|["”']$/g, "")
              : "",
            syn: synMatch ? synMatch[1].trim() : "",
            ant: antMatch ? antMatch[1].trim() : "",
          };
          words.push(newWord);
          count++;
        });

        if (count > 0) {
          currentDay = targetDay;
          saveData();
          renderList();
          closeModal("smartImportModal");
          showToast(`Imported ${count} words to Day ${targetDay}!`, "success");
        } else {
          showToast(
            "Could not extract any words. Please check your text format.",
            "error",
          );
        }
      }

      function setWordStatus(status) {
        if (!currentViewingId) return;
        const idx = words.findIndex((w) => w.id === currentViewingId);
        if (idx > -1) {
          words[idx].status = status;
          saveData();
          renderList();
          closeModal("wordModal");
        }
      }

      function speakWord() {
        const word = document.getElementById("mWord").innerText;
        if (word) {
          const u = new SpeechSynthesisUtterance(word);
          u.lang = "en-US";
          speechSynthesis.speak(u);
        }
      }
      function toggleTools() {
        document.getElementById("toolsMenu").classList.toggle("hidden");
      }
      function closeTools() {
        document.getElementById("toolsMenu").classList.add("hidden");
      }
      function openSmartImport() {
        document.getElementById("smartImportModal").classList.remove("hidden");
        document.getElementById("smartImportInput").value = "";
        document.getElementById("smartImportDay").value =
          getSuggestedDayForCurrentView();
        closeTools();
      }
      function closeModal(id) {
        document.getElementById(id).classList.add("hidden");
      }
      function downloadBackup() {
        const dataStr =
          "data:text/json;charset=utf-8," +
          encodeURIComponent(JSON.stringify(words));
        const a = document.createElement("a");
        a.href = dataStr;
        a.download = "vocab_backup.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        closeTools();
      }
      function restoreBackup(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
          words = JSON.parse(e.target.result);
          saveData();
          renderList();
          alert("Restored!");
        };
        reader.readAsText(file);
        closeTools();
      }

      init();
    </script>
  </body>
</html>
