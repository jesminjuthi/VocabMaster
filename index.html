<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juthi's Vocab Master Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Hind+Siliguri:wght@400;600&display=swap");
      body {
        font-family: "Inter", "Hind Siliguri", sans-serif;
      }
      .custom-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 4px;
      }
      @keyframes slideUp {
        from {
          transform: translateY(100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .animate-slide-up {
        animation: slideUp 0.3s ease-out forwards;
      }
    </style>
  </head>
  <body class="bg-gray-100 h-screen flex flex-col items-center">
    <div
      class="w-full max-w-md h-full bg-white shadow-2xl flex flex-col relative overflow-hidden"
    >
      <div class="p-4 bg-white border-b shadow-sm sticky top-0 z-10">
        <div class="flex justify-between items-center mb-4">
          <div class="flex items-center gap-2">
            <div
              class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-lg"
            >
              <i class="fa-solid fa-graduation-cap text-sm"></i>
            </div>
            <h1 class="text-lg font-extrabold text-gray-800">
              Juthi's <span class="text-indigo-600">VocabMaster</span>
            </h1>
          </div>

          <div class="flex gap-2">
            <button
              onclick="toggleTools()"
              class="bg-gray-100 hover:bg-gray-200 text-gray-700 w-8 h-8 rounded-full transition flex items-center justify-center relative"
            >
              <i class="fa-solid fa-gear"></i>
            </button>
            <button
              onclick="openAddModal()"
              class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded-full text-xs font-bold shadow-lg transition flex items-center gap-1"
            >
              <i class="fa-solid fa-plus"></i> Add
            </button>
          </div>
        </div>

        <div
          id="toolsMenu"
          class="hidden absolute right-4 top-16 bg-white shadow-xl border rounded-xl p-2 w-48 z-50"
        >
          <button
            onclick="openSmartImport()"
            class="w-full text-left px-3 py-2 hover:bg-indigo-50 rounded-lg text-xs font-bold text-gray-700 flex items-center gap-2"
          >
            <i class="fa-solid fa-magic-wand-sparkles text-indigo-500"></i>
            Smart Text Import
          </button>
          <button
            onclick="downloadBackup()"
            class="w-full text-left px-3 py-2 hover:bg-indigo-50 rounded-lg text-xs font-bold text-gray-700 flex items-center gap-2"
          >
            <i class="fa-solid fa-download text-green-600"></i> Backup Data
          </button>
          <label
            class="w-full text-left px-3 py-2 hover:bg-indigo-50 rounded-lg text-xs font-bold text-gray-700 flex items-center gap-2 cursor-pointer"
            ><i class="fa-solid fa-upload text-blue-600"></i> Restore
            Backup<input
              type="file"
              id="backupFile"
              class="hidden"
              onchange="restoreBackup(this)"
          /></label>
        </div>

        <div
          class="flex items-center justify-between bg-gray-50 rounded-xl p-2 border border-gray-100"
        >
          <button
            onclick="changeDay(-1)"
            class="w-8 h-8 flex items-center justify-center bg-white rounded shadow-sm text-gray-600 hover:text-indigo-600"
          >
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <div class="text-center">
            <span class="block text-[10px] text-gray-400 font-bold uppercase"
              >Current Group</span
            ><span id="dayIndicator" class="text-base font-bold text-indigo-900"
              >Day 1</span
            >
          </div>
          <button
            onclick="changeDay(1)"
            class="w-8 h-8 flex items-center justify-center bg-white rounded shadow-sm text-gray-600 hover:text-indigo-600"
          >
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      </div>

      <div
        class="flex-1 overflow-y-auto bg-gray-50 p-4 custom-scroll"
        onclick="closeTools()"
      >
        <div id="wordList" class="space-y-3 pb-20"></div>
      </div>
    </div>

    <div
      id="wordModal"
      class="fixed inset-0 z-40 hidden flex items-center justify-center p-4"
    >
      <div
        class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity"
        onclick="closeModal('wordModal')"
      ></div>
      <div
        class="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden relative z-50 animate-slide-up"
      >
        <div class="absolute top-4 right-4 z-20 flex gap-2">
          <button
            onclick="editCurrentWord()"
            class="w-8 h-8 bg-white/20 hover:bg-white/40 text-white rounded-full flex items-center justify-center backdrop-blur-md transition"
          >
            <i class="fa-solid fa-pen text-xs"></i>
          </button>
          <button
            onclick="deleteCurrentWord()"
            class="w-8 h-8 bg-red-500/20 hover:bg-red-500 text-white rounded-full flex items-center justify-center backdrop-blur-md transition"
          >
            <i class="fa-solid fa-trash text-xs"></i>
          </button>
          <button
            onclick="closeModal('wordModal')"
            class="w-8 h-8 bg-black/20 hover:bg-black/40 text-white rounded-full flex items-center justify-center backdrop-blur-md transition ml-2"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div
          class="bg-gradient-to-br from-indigo-500 to-purple-600 p-8 text-center text-white pt-16 pb-10"
        >
          <h2 id="mWord" class="text-3xl font-bold font-serif mb-2 capitalize">
            Word
          </h2>
          <div
            class="flex justify-center items-center flex-wrap gap-2 opacity-90 text-sm"
          >
            <span
              id="mPhonetic"
              class="font-mono bg-black/20 px-2 py-0.5 rounded hidden"
            ></span>
          </div>
        </div>
        <div class="p-6 text-center space-y-4">
          <div class="flex justify-center -mt-10">
            <span
              id="mPos"
              class="w-12 h-12 flex items-center justify-center bg-white text-indigo-600 font-bold rounded-full text-lg shadow-md border-4 border-indigo-50"
              >n.</span
            >
          </div>
          <div>
            <h3
              id="mDefEng"
              class="text-gray-800 font-bold text-lg leading-tight"
            >
              Definition
            </h3>
            <p
              id="mMeaningBn"
              class="text-indigo-600 text-base font-hind font-semibold mt-1 border-t border-gray-100 pt-1 inline-block"
            ></p>
          </div>
          <div
            class="bg-indigo-50/50 border-l-4 border-indigo-400 p-3 text-left rounded-r-lg"
          >
            <p id="mExample" class="text-gray-600 italic text-sm"></p>
          </div>

          <div
            class="flex justify-center gap-6 text-xs text-gray-500 border-t border-gray-100 pt-4"
          >
            <div>
              <span class="font-bold text-teal-600 uppercase">Synonym</span
              ><br /><span id="mSyn" class="text-gray-800 font-medium">-</span>
            </div>
            <div>
              <span class="font-bold text-rose-500 uppercase">Antonym</span
              ><br /><span id="mAnt" class="text-gray-800 font-medium">-</span>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-4 mt-2">
            <button
              onclick="speakWord()"
              class="flex flex-col items-center gap-1 group"
            >
              <div
                class="w-12 h-12 rounded-full bg-yellow-100 text-yellow-600 flex items-center justify-center shadow-sm group-hover:scale-110 transition"
              >
                <i class="fa-solid fa-volume-high"></i>
              </div>
              <span class="text-[10px] font-bold text-gray-400">Speak</span>
            </button>
            <button
              onclick="setWordStatus('learned')"
              class="flex flex-col items-center gap-1 group"
            >
              <div
                class="w-12 h-12 rounded-full bg-green-100 text-green-600 flex items-center justify-center shadow-sm group-hover:bg-green-500 group-hover:text-white transition"
              >
                <i class="fa-solid fa-check"></i>
              </div>
              <span class="text-[10px] font-bold text-gray-400">Done</span>
            </button>
            <button
              onclick="setWordStatus('problem')"
              class="flex flex-col items-center gap-1 group"
            >
              <div
                class="w-12 h-12 rounded-full bg-red-100 text-red-500 flex items-center justify-center shadow-sm group-hover:bg-red-500 group-hover:text-white transition"
              >
                <i class="fa-solid fa-xmark"></i>
              </div>
              <span class="text-[10px] font-bold text-gray-400">Review</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      id="smartImportModal"
      class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4"
    >
      <div class="bg-white w-full max-w-lg rounded-2xl p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-gray-800">
            <i class="fa-solid fa-magic-wand-sparkles text-indigo-600 mr-2"></i
            >Smart Text Import
          </h2>
          <button
            onclick="closeModal('smartImportModal')"
            class="text-gray-400 hover:text-red-500"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <p class="text-xs text-gray-500 mb-2">
          Paste text below. It handles Synonyms/Antonyms correctly.
        </p>
        <textarea
          id="smartImportInput"
          class="w-full h-64 border bg-gray-50 p-3 rounded-lg font-mono text-xs focus:outline-indigo-500"
          placeholder="1. Abate..."
        ></textarea>
        <div class="flex justify-end gap-3 mt-4">
          <button
            onclick="closeModal('smartImportModal')"
            class="px-4 py-2 text-gray-500 font-bold hover:bg-gray-100 rounded-lg text-xs"
          >
            Cancel
          </button>
          <button
            onclick="processSmartImport()"
            class="px-6 py-2 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 shadow-lg text-xs"
          >
            Parse & Save
          </button>
        </div>
      </div>
    </div>

    <div
      id="addModal"
      class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4"
    >
      <div
        class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-xl h-4/5 flex flex-col"
      >
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold">
            <span id="addModalTitle">Add Word</span>
            <span class="text-indigo-600 text-sm" id="addModalDayLabel"></span>
          </h2>
          <button onclick="closeModal('addModal')">
            <i class="fa-solid fa-xmark text-gray-400"></i>
          </button>
        </div>
        <form
          id="addWordForm"
          class="space-y-3 flex-1 overflow-y-auto custom-scroll pr-1"
        >
          <input type="hidden" id="editId" />
          <input
            type="text"
            id="inpWord"
            placeholder="Word"
            class="w-full border-b-2 p-2 focus:border-indigo-500 outline-none font-bold text-lg"
            required
          />
          <input
            type="text"
            id="inpMeaningBn"
            placeholder="Bangla Meaning"
            class="w-full border p-2 rounded bg-gray-50 font-hind"
            required
          />
          <div class="grid grid-cols-2 gap-2">
            <input
              type="text"
              id="inpPhonetic"
              placeholder="Phonetic"
              class="w-full border p-2 rounded bg-gray-50 text-xs"
            />
            <input
              type="text"
              id="inpPos"
              placeholder="POS"
              class="w-full border p-2 rounded bg-gray-50 text-xs"
            />
          </div>
          <textarea
            id="inpDefEng"
            placeholder="English Definition"
            class="w-full border p-2 rounded bg-gray-50 text-xs h-16"
          ></textarea>
          <input
            type="text"
            id="inpExample"
            placeholder="Example"
            class="w-full border p-2 rounded bg-gray-50 text-xs"
          />
          <div class="grid grid-cols-2 gap-2">
            <input
              type="text"
              id="inpSyn"
              placeholder="Synonyms"
              class="w-full border p-2 rounded bg-gray-50 text-xs"
            />
            <input
              type="text"
              id="inpAnt"
              placeholder="Antonyms"
              class="w-full border p-2 rounded bg-gray-50 text-xs"
            />
          </div>
          <button
            type="submit"
            class="w-full py-2 bg-indigo-600 text-white rounded-lg font-bold mt-2"
          >
            Save Word
          </button>
        </form>
      </div>
    </div>

    <script>
      let currentDay = 1;
      let words = [];
      let currentViewingId = null;

      const initialData = [
        {
          id: 1,
          day: 1,
          status: "neutral",
          word: "Welcome",
          phonetic: "/wel-kəm/",
          meaningBn: "স্বাগতম",
          pos: "n.",
          defEng: "Greeting",
          example: "Welcome to Vocab Master.",
          syn: "Hello",
          ant: "Goodbye",
        },
      ];

      function init() {
        const stored = localStorage.getItem("vocabProData");
        words = stored ? JSON.parse(stored) : initialData;
        const lastDay = localStorage.getItem("vocabCurrentDay");
        if (lastDay) currentDay = parseInt(lastDay);
        updateDayUI();
        renderList();
      }

      function saveData() {
        localStorage.setItem("vocabProData", JSON.stringify(words));
        localStorage.setItem("vocabCurrentDay", currentDay);
      }
      function changeDay(dir) {
        const newDay = currentDay + dir;
        if (newDay < 1) return;
        currentDay = newDay;
        updateDayUI();
        renderList();
        saveData();
      }
      function updateDayUI() {
        document.getElementById("dayIndicator").innerText = `Day ${currentDay}`;
      }

      function renderList() {
        const container = document.getElementById("wordList");
        container.innerHTML = "";
        const dayWords = words.filter((w) => w.day === currentDay);
        if (dayWords.length === 0) {
          container.innerHTML = `<div class="text-center py-20 text-gray-400"><p class="text-sm font-bold">No words in Day ${currentDay}</p></div>`;
          return;
        }
        dayWords.forEach((item) => {
          const div = document.createElement("div");
          let statusClass =
            "bg-white border-l-4 border-transparent hover:border-indigo-300";
          let icon = `<i class="fa-solid fa-chevron-right text-gray-300 text-xs"></i>`;
          if (item.status === "learned") {
            statusClass = "bg-green-50 border-l-4 border-green-500";
            icon = `<i class="fa-solid fa-check text-green-500"></i>`;
          } else if (item.status === "problem") {
            statusClass = "bg-red-50 border-l-4 border-red-500";
            icon = `<i class="fa-solid fa-exclamation text-red-500"></i>`;
          }
          div.className = `p-4 rounded-xl shadow-sm flex items-center justify-between cursor-pointer transition transform active:scale-95 ${statusClass}`;
          div.onclick = () => openWordModal(item.id);
          div.innerHTML = `<div class="flex-1 min-w-0 mr-2"><h3 class="font-bold text-gray-700 text-lg capitalize ${item.status === "learned" ? "text-green-700" : ""}">${item.word}</h3><p class="text-sm text-gray-500 font-hind truncate">${item.meaningBn || "No Meaning"}</p></div><div>${icon}</div>`;
          container.appendChild(div);
        });
      }

      function openWordModal(id) {
        currentViewingId = id;
        const item = words.find((w) => w.id === id);
        if (!item) return;
        document.getElementById("mWord").innerText = item.word;
        const phEl = document.getElementById("mPhonetic");
        if (item.phonetic) {
          phEl.innerText = item.phonetic;
          phEl.classList.remove("hidden");
        } else {
          phEl.classList.add("hidden");
        }
        document.getElementById("mMeaningBn").innerText =
          item.meaningBn || "No Meaning";
        document.getElementById("mPos").innerText = item.pos || "w";
        document.getElementById("mDefEng").innerText =
          item.defEng || "No definition";
        document.getElementById("mExample").innerText = item.example
          ? `"${item.example}"`
          : "";
        // Fix: Fallback to '-' if empty
        document.getElementById("mSyn").innerText = item.syn || "-";
        document.getElementById("mAnt").innerText = item.ant || "-";
        document.getElementById("wordModal").classList.remove("hidden");
      }

      function deleteCurrentWord() {
        if (!currentViewingId) return;
        if (confirm("Are you sure you want to delete this word?")) {
          words = words.filter((w) => w.id !== currentViewingId);
          saveData();
          renderList();
          closeModal("wordModal");
        }
      }

      function editCurrentWord() {
        if (!currentViewingId) return;
        const item = words.find((w) => w.id === currentViewingId);
        if (!item) return;
        closeModal("wordModal");
        openAddModal(item);
      }

      function openAddModal(editingItem = null) {
        const modal = document.getElementById("addModal");
        const form = document.getElementById("addWordForm");
        modal.classList.remove("hidden");
        if (editingItem) {
          document.getElementById("addModalTitle").innerText = "Edit Word";
          document.getElementById("editId").value = editingItem.id;
          document.getElementById("inpWord").value = editingItem.word;
          document.getElementById("inpMeaningBn").value = editingItem.meaningBn;
          document.getElementById("inpPhonetic").value = editingItem.phonetic;
          document.getElementById("inpPos").value = editingItem.pos;
          document.getElementById("inpDefEng").value = editingItem.defEng;
          document.getElementById("inpExample").value = editingItem.example;
          document.getElementById("inpSyn").value = editingItem.syn || "";
          document.getElementById("inpAnt").value = editingItem.ant || "";
        } else {
          document.getElementById("addModalTitle").innerText = "Add Word";
          form.reset();
          document.getElementById("editId").value = "";
        }
        document.getElementById("addModalDayLabel").innerText = editingItem
          ? `(Day ${editingItem.day})`
          : `(Day ${currentDay})`;
      }

      document
        .getElementById("addWordForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const editId = document.getElementById("editId").value;
          const wordData = {
            word: document.getElementById("inpWord").value,
            meaningBn: document.getElementById("inpMeaningBn").value,
            phonetic: document.getElementById("inpPhonetic").value,
            pos: document.getElementById("inpPos").value,
            defEng: document.getElementById("inpDefEng").value,
            example: document.getElementById("inpExample").value,
            syn: document.getElementById("inpSyn").value,
            ant: document.getElementById("inpAnt").value,
          };
          if (editId) {
            const index = words.findIndex((w) => w.id == editId);
            if (index > -1) words[index] = { ...words[index], ...wordData };
          } else {
            const newWord = {
              id: Date.now(),
              day: currentDay,
              status: "neutral",
              ...wordData,
            };
            words.push(newWord);
          }
          saveData();
          renderList();
          e.target.reset();
          closeModal("addModal");
        });

      // --- FIXED SMART IMPORT LOGIC ---
      function processSmartImport() {
        const text = document.getElementById("smartImportInput").value;
        if (!text.trim()) return;
        const blocks = text.split(/\n(?=\d+\.)/g);
        let count = 0;

        blocks.forEach((block, index) => {
          const rawLines = block
            .split("\n")
            .map((l) => l.trim())
            .filter((l) => l.length > 0);
          if (rawLines.length < 2) return;
          const wordLine = rawLines[0].replace(/^\d+\.\s*/, "").trim();

          const fullBlockStr = block.replace(/\n/g, " ");

          const phoneticMatch = fullBlockStr.match(/(\/.*?\/?\/)/);
          const meaningMatch = fullBlockStr.match(/\(([^)]+)\)/);

          const defMatch = fullBlockStr.match(
            /Definition:\s*(.*?)(?=Example:|Synonym:|Antonym:|$)/i,
          );
          const exMatch = fullBlockStr.match(
            /Example:\s*["“]?(.*?)["”]?(?=Synonym:|Antonym:|$)/i,
          );

          const synMatch = fullBlockStr.match(
            /Synonyms?:\s*(.+?)(?=\s*Antonyms?:|$)/i,
          );

          const antMatch = fullBlockStr.match(/Antonyms?:\s*(.+?)$/i);

          let pos = "n.";
          const posMatch = fullBlockStr.match(/\b(n\.|v\.|adj\.|adv\.)\b/i);
          if (posMatch) pos = posMatch[1];

          const newWord = {
            id: Date.now() + index,
            day: currentDay,
            status: "neutral",
            word: wordLine,
            phonetic: phoneticMatch ? phoneticMatch[1] : "",
            meaningBn: meaningMatch ? meaningMatch[1].trim() : "",
            pos: pos,
            defEng: defMatch ? defMatch[1].trim() : "",
            example: exMatch ? exMatch[1].trim() : "",
            syn: synMatch ? synMatch[1].trim() : "",
            ant: antMatch ? antMatch[1].trim() : "",
          };
          words.push(newWord);
          count++;
        });
        saveData();
        renderList();
        closeModal("smartImportModal");
        alert(`Imported ${count} words with Syn/Ant!`);
      }

      function setWordStatus(status) {
        if (!currentViewingId) return;
        const idx = words.findIndex((w) => w.id === currentViewingId);
        if (idx > -1) {
          words[idx].status = status;
          saveData();
          renderList();
          closeModal("wordModal");
        }
      }
      function speakWord() {
        const word = document.getElementById("mWord").innerText;
        if (word) {
          const u = new SpeechSynthesisUtterance(word);
          u.lang = "en-US";
          speechSynthesis.speak(u);
        }
      }
      function toggleTools() {
        document.getElementById("toolsMenu").classList.toggle("hidden");
      }
      function closeTools() {
        document.getElementById("toolsMenu").classList.add("hidden");
      }
      function openSmartImport() {
        document.getElementById("smartImportModal").classList.remove("hidden");
        document.getElementById("smartImportInput").value = "";
        closeTools();
      }
      function closeModal(id) {
        document.getElementById(id).classList.add("hidden");
      }
      function downloadBackup() {
        const dataStr =
          "data:text/json;charset=utf-8," +
          encodeURIComponent(JSON.stringify(words));
        const a = document.createElement("a");
        a.href = dataStr;
        a.download = "vocab_backup.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        closeTools();
      }
      function restoreBackup(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (e) {
          words = JSON.parse(e.target.result);
          saveData();
          renderList();
          alert("Restored!");
        };
        reader.readAsText(file);
        closeTools();
      }

      init();
    </script>
  </body>
</html>
